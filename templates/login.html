<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sign In — VoiceDesk AI Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/landing.css?v=5.0">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      position: relative;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.4);
      position: relative;
      z-index: 2;
    }

    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .auth-card h2 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-white);
      text-align: center;
      margin-bottom: 6px;
    }

    .auth-sub {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
    }

    /* 1-Click Demo Login Box */
    .demo-login-box {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dlb-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #34d399;
    }

    .btn-quick-demo {
      background: var(--accent-emerald);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s;
    }

    .btn-quick-demo:hover {
      background: #059669;
      transform: translateY(-1px);
    }

    .btn-quick-demo-alt {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-card);
      color: #e2e8f0;
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s;
    }

    .btn-quick-demo-alt:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-highlight);
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .auth-divider span {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .auth-divider::before, .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .auth-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .auth-field label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .auth-field input {
      background: var(--bg-surface);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: var(--text-white);
      font-family: inherit;
      font-size: 13px;
      transition: all 0.15s;
    }

    .auth-field input:focus {
      outline: none;
      border-color: var(--accent-emerald);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .auth-options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .auth-options-row a {
      color: var(--accent-emerald);
      font-weight: 600;
    }

    .btn-submit-auth {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 12px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      transition: all 0.15s;
    }

    .btn-submit-auth:hover {
      filter: brightness(1.08);
    }

    .auth-foot {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 20px;
    }

    .auth-foot a {
      color: var(--accent-emerald);
      font-weight: 700;
    }

    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 20px;
      transition: color 0.15s;
    }

    .back-home-link:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="hero-mesh-glow"></div>

    <a href="/" class="back-home-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      <span>Back to VoiceDesk AI Home</span>
    </a>

    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-logo-disc">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          </svg>
        </div>
        <span class="brand-title">VoiceDesk AI</span>
      </div>

      <h2>Sign In to Business Console</h2>
      <p class="auth-sub">Access your autonomous voice agents, call analytics, and receipts</p>

      <!-- 1-Click Demo Login Box -->
      <div class="demo-login-box">
        <div class="dlb-title">
          <span>⚡ Instant Demo Access</span>
          <span class="badge badge-tool-active">1-Click</span>
        </div>
        <button type="button" class="btn-quick-demo" id="btn-login-clinic">
          <span>Enter as Dental Clinic Admin (SmileCare)</span>
          <span>→</span>
        </button>
        <button type="button" class="btn-quick-demo-alt" id="btn-login-restaurant">
          <span>Enter as Restaurant Manager (Lahore Grill)</span>
          <span>→</span>
        </button>
      </div>

      <div class="auth-divider">
        <span>Or sign in with business email</span>
      </div>

      <form class="auth-form" id="standard-login-form">
        <div class="auth-field">
          <label for="login-email">Business Email</label>
          <input type="email" id="login-email" required value="admin@smilecare.pk" placeholder="admin@yourbusiness.pk">
        </div>

        <div class="auth-field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required value="••••••••••••" placeholder="Enter password">
        </div>

        <div class="auth-options-row">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
            <input type="checkbox" checked>
            <span>Remember for 30 days</span>
          </label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn-submit-auth">Sign In to Dashboard</button>
      </form>

      <div class="auth-foot">
        Don't have a business account? <a href="/signup">Create Free Trial</a>
      </div>
    </div>
  </div>

  <script>
    // 1-Click Demo Logins
    document.getElementById('btn-login-clinic')?.addEventListener('click', () => {
      document.cookie = "auth_session=clinic_admin; path=/; max-age=86400";
      window.location.href = '/demo';
    });

    document.getElementById('btn-login-restaurant')?.addEventListener('click', () => {
      document.cookie = "auth_session=restaurant_admin; path=/; max-age=86400";
      window.location.href = '/demo';
    });

    document.getElementById('standard-login-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      document.cookie = "auth_session=business_admin; path=/; max-age=86400";
      window.location.href = '/demo';
    });
  </script>
</body>
</html>
